# You can replace and test a more recent version of docker compose
version: "3.8"
services:
  db:
    extends:
      file: ./config/docker/compose/mariadb.yml
      service: mariadb

  fineract:
    extends:
      file: ./config/docker/compose/fineract-custom.yml
      service: fineract
    ports:
      # @rezliant RZ-A5BDF4F1 · 2026-09-22 — Restricts HTTPS interface exposure to localhost
      - "127.0.0.1:8443:8443"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./config/docker/env/fineract.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-mariadb.env

# @rezliant-change-log:start
# RZ-A5BDF4F1 · 2026-09-22 · Service port exposed on all interfaces (CWE-1327)
# Change: Bound port 8443:8443 to 127.0.0.1 instead of 0.0.0.0
# Benefit: Restricts HTTPS interface exposure to localhost
# Scope: fineract service ports section (line 32)

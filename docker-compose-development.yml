x-logging: &default-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/api/prom/push'
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}.\d{3}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<date>\d{4}-\d{2}-\d{2}) (?P<time>\d{2}:\d{2}:\d{2}.\d{3}) (?P<message>(?s:.*))$$'

version: "3.8"

services:
  loki:
    extends:
      file: ./config/docker/compose/observability.yml
      service: loki

  prometheus:
    extends:
      file: ./config/docker/compose/observability.yml
      service: prometheus
    depends_on:
      - loki

  grafana:
    extends:
      file: ./config/docker/compose/observability.yml
      service: grafana
    depends_on:
      - loki

  tempo:
    extends:
      file: ./config/docker/compose/observability.yml
      service: tempo
    depends_on:
      - loki

  db:
    extends:
      file: ./config/docker/compose/mariadb.yml
      service: mariadb
    depends_on:
      - loki
    logging: *default-logging

  fineract:
    container_name: fineract-development
    extends:
      file: ./config/docker/compose/fineract.yml
      service: fineract
    # @rezliant RZ-ABA1FA3E · 2026-09-22 — Restricts development service access to localhost only
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    env_file:
      - ./config/docker/env/aws.env
      - ./config/docker/env/fineract.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-mariadb.env
      - ./config/docker/env/tracing.env
      - ./config/docker/env/oltp.env
      - ./config/docker/env/prometheus.env
      # - ./config/docker/env/cloudwatch.env
      - ./config/docker/env/debug.env
    logging: *default-logging

# @rezliant-change-log:start
# RZ-ABA1FA3E · 2026-09-22 · Port binding exposed on all interfaces
# Change: Bound fineract service ports 8443 and 5000 to localhost (127.0.0.1)
# Benefit: Restricts development service access to localhost only
# Scope: fineract service ports configuration
#
# Rezliant remediation history: 1 total · 1 most recent shown
# @rezliant-change-log:end
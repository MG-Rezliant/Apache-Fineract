version: "3.8"

services:
  postgresql:
    image: postgres:16.1
    volumes:
      - ${PWD}/config/docker/postgresql/docker-entrypoint-initdb.d/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:Z,ro
    restart: always
    env_file:
      - ${PWD}/config/docker/env/postgresql.env
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root" ]
      timeout: 10s
      retries: 10
    ports:
      # @rezliant RZ-F7164F2F · 2026-09-22 — Prevents external network exposure of database service
      - "127.0.0.1:5432:5432"

# @rezliant-change-log:start
# RZ-F7164F2F · 2026-09-22 · PostgreSQL port bound to all interfaces (0.0.0.0)

version: "3.8"

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.4
    volumes:
      - ${PWD}/config/docker/mysql/conf.d/server_collation.cnf:/etc/mysql/conf.d/server_collation.cnf:ro
      - ${PWD}/config/docker/mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:Z,ro
    restart: always
    env_file:
      - ${PWD}/config/docker/env/mysql.env
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
      timeout: 10s
      retries: 10
    ports:
      # @rezliant RZ-3820AAD4 · 2026-09-22 — Restricts database access to localhost only
      - "127.0.0.1:3306:3306"

# @rezliant-change-log:start
# RZ-3820AAD4 · 2026-09-22 · MariaDB service port exposed on all interfaces
# Change: Bound port 3306 explicitly to 127.0.0.1 instead of 0.0.0.0
# Benefit: Restricts database access to localhost only, preventing external network exposure
# Scope: mariadb service ports section
#
